# Producción en el Ampere A1.
# La base NO publica puertos: solo se llega por la red interna de compose.

services:
  web:
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_COLLECTSTATIC: "1"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/var/www/static:ro
      - media:/var/www/media:ro
      # Certificados de Let's Encrypt emitidos en el host con certbot.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot

volumes:
  certbot-www:
