# Producción en el Ampere A1 de Oracle Cloud.
# La base NO publica puertos: solo se llega por la red interna de compose.
#
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build

services:
  web:
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_COLLECTSTATIC: "1"
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${DOMINIO}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-responder@${DOMINIO}}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      # El entrypoint de la imagen corre envsubst sobre /etc/nginx/templates/*.template
      # y escribe el resultado en /etc/nginx/conf.d/. Así el dominio vive en .env
      # y no hay que editar el archivo de nginx en el servidor.
      DOMINIO: ${DOMINIO}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx:/etc/nginx/templates:ro
      - staticfiles:/var/www/static:ro
      - media:/var/www/media:ro
      # Certificados emitidos en el host con certbot (paquete del sistema; su
      # timer renueva solo). El webroot es un directorio del host, no un volumen
      # de docker, justamente para que certbot pueda escribir el desafío ahí.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /srv/certbot:/var/www/certbot:ro
