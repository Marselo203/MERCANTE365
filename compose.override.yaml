# Desarrollo local. Compose lo carga automáticamente junto a compose.yaml.
# En el servidor no se usa, porque allá arrancas con -f explícitos.

services:
  db:
    ports:
      - "127.0.0.1:5432:5432"   # solo loopback: para psql o pgAdmin desde el host

  web:
    # Corre con tu uid del host para que makemigrations y los .pyc se escriban
    # con permisos tuyos sobre el bind-mount. En producción manda el USER app
    # del Dockerfile.
    user: "1000:1000"
    environment:
      DJANGO_DEBUG: "1"
      HOME: /tmp
      DJANGO_COLLECTSTATIC: "0"
      # Apunta al MinIO local en lugar de a OCI. Comenta estas cuatro líneas
      # para volver a guardar las imágenes en disco y comparar comportamientos.
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_STORAGE_BUCKET_NAME: b2b-media
      AWS_S3_ENDPOINT_URL: http://minio:9000
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app                  # autoreload sobre el código del host
      - /app/staticfiles        # volúmenes anónimos para que el bind mount
      - /app/media              # de arriba no tape estos directorios
    ports:
      - "8000:8000"
    stdin_open: true
    tty: true                   # permite breakpoint() con docker compose attach web
    depends_on:
      minio:
        condition: service_healthy

  # MinIO habla la misma API S3 que OCI Object Storage. Sirve para desarrollar
  # y probar toda la ruta de subida de imágenes sin tener cuenta en Oracle:
  # el día que migres solo cambias las cuatro variables de arriba.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # consola web
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Crea el bucket y lo deja de lectura pública, igual que necesitarás el bucket
  # de imágenes en OCI. Corre una vez y termina.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/b2b-media &&
      mc anonymous set download local/b2b-media &&
      echo 'Bucket b2b-media listo.'
      "

volumes:
  miniodata:
